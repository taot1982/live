name: Fetch IPTV Source
on:
  workflow_dispatch: # 支持手动点运行
  schedule:
    - cron: '0 8 * * *' # 每天早8点定时，UTC时间，按需改

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscaled --tun=userspace-networking --socks5-server=localhost:1055 &
          sleep 5

      - name: Connect Tailscale (ExitNode)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo tailscale up --authkey $TAILSCALE_AUTHKEY --exit-node=100.72.39.7
          sleep 10
          curl --interface ts0 ifconfig.me # 验证出口是否变成你家IP

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run fetch script
        run: python fetch.py

      # 重点：采集完立刻断开tailscale，后面git不走家里隧道
      - name: Disconnect Tailscale
        run: sudo tailscale down

      - name: Git config & commit
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add test.m3u
          git commit -m "auto update test.m3u" || echo "无变更，跳过提交"
          git push https://github.com/${{ github.repository }}.git HEAD:main
