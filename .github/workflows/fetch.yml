name: IPTV Source Fetch
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y curl python3 python3-pip
          pip3 install requests

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start Tailscale & connect Exit Node
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo pkill -9 tailscaled || true
          sudo rm -f /var/run/tailscale/tailscaled.sock
          sleep 2
          sudo tailscaled --tun=userspace-networking --socks5-server=localhost:1055 &
          sleep 8
          sudo tailscale up --authkey $TAILSCALE_AUTHKEY --exit-node=100.72.39.7
          sleep 15
          # 测试是否成功走家里出口
          curl --socks5 127.0.0.1:1055 ifconfig.me

      - name: Run python script to get source and generate test.m3u
        run: python3 fetch.py

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add test.m3u
          git commit -m "Auto update test.m3u" || echo "No change"
          git push
