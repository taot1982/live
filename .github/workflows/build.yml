name: Build IPTV
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 16,18,20,22,0,2,4,6,8,10,12,14 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install requests
        run: pip install requests
      - name: Run python
        run: python fetch_and_check.py
      - name: Commit & Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add live.m3u
          git commit -m "auto update iptv" || true
          git push
