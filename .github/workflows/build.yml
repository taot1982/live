name: Build IPTV
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install requests
        run: pip install requests

      - name: Run python
        run: python3 fetch_and_check.py

      - name: Commit & Push
        run: |
          git config --global user.name "taot1982"
          git config --global user.email "taot1982@example.com"
          git add live.txt uzi.txt live1.txt live2.txt
          git commit -m "auto normalize uzi + filter stream" || echo "no change"
          git push --force-with-lease
