name: Fetch zhibo.txt
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'  # 每4小时执行一次（UTC时间）

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install requests
        run: pip install requests

      - name: Run fetch_zhibo.py
        run: python scripts/fetch_zhibo.py

      - name: Commit & Push zhibo.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add zhibo.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update zhibo.txt"
          git push
