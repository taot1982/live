name: Filter Shanghai IPTV
on:
  push:
    paths:
      - 'iptasd.txt'
      - 'filter_sh.py'
  workflow_dispatch: # 支持手动点运行

jobs:
  run-filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run filter script
        run: python3 filter.py

      - name: Commit & Push result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shiptv.txt
          git commit -m "Auto update shiptv.txt from iptasd.txt" || echo "No changes"
          git push
