name: Auto IPTV Update & Check
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fetch & filter script
        run: |
          python script/fetch_and_check.py

      - name: Commit and push
        run: |
          git config user.name "IPTV-AutoBot"
          git config user.email "bot@example.com"
          git add live.txt
          git commit -m "auto refresh $(date -Iseconds)" || exit 0
          git push
