name: Auto Fetch & Merge IPTV Sources
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Fetch iptv.txt (a.u9c.cn)
        run: python scripts/fetch_iptv.py

      - name: Fetch fixed_zhibo.txt
        run: python scripts/fix.py

      - name: Fetch iptasd.txt
        run: python scripts/fix_iptasd.py

      - name: Run merge.py to generate live.txt
        run: python merge.py

      - name: Commit & Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add iptv.txt fixed_zhibo.txt iptasd.txt live.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 auto update live.txt"
          git push
