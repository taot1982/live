name: Auto Fetch & Merge IPTV Sources
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */5 * * *'
  push:
    paths:
      - 'iptv.txt'
      - 'iptasd.txt'
      - 'zhibo.txt'
      - 'ZB.TXT'
      - 'shiptv.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install python dependencies
        run: pip install requests urllib3

      - name: 同步仓库最新 merge.py 代码
        run: |
          curl -fsSL "https://raw.githubusercontent.com/taot1982/live/refs/heads/main/merge.py" -o merge.py

      - name: Fetch iptv source
        run: python scripts/fetch_iptv.py

      - name: Fix iptasd source
        run: python scripts/fetch_iptasd.py

      - name: Fetch zhibo source（央视咪咕）
        run: python scripts/fetch_zhibo.py

      - name: Run filter_sh.py 生成shiptv.txt
        run: python3 filter_sh.py

      - name: Run merge.py 合并生成 live.txt
        run: python3 merge.py

      - name: Commit & Push updated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.txt iptv.txt iptasd.txt zhibo.txt ZB.TXT shiptv.txt merge.py filter_sh.py
          if ! git diff --quiet --cached; then
            git commit -m "auto update live: source file changed [skip ci]"
            git push
          else
            echo "没有文件变动，跳过提交"
          fi
