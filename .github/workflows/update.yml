name: Auto Fetch & Merge IPTV Sources
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */5 * * *'
  push:
    paths:
      - 'iptv.txt'
      - 'iptasd.txt'
      - 'zhibo.txt'
      - 'ZB.TXT'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check if iptasd.txt changed
        id: check_iptasd
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q 'iptasd.txt'; then
            echo "run_filter=true" >> $GITHUB_OUTPUT
          else
            echo "run_filter=false" >> $GITHUB_OUTPUT
          fi

      - name: Run filter_sh.py（仅iptasd.txt改动时执行）
        if: steps.check_iptasd.outputs.run_filter == 'true'
        run: python3 filter_sh.py

      - name: Run merge.py
        run: python3 merge.py

      - name: Commit & Push result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shiptv.txt live.txt
          git commit -m "Auto update [skip ci]" || echo "No changes"
          git push
