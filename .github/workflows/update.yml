name: Auto Fetch & Merge IPTV Sources
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install python dependencies
        run: pip install requests urllib3

      - name: 同步仓库最新 merge.py 代码
        run: |
          curl -fsSL "https://raw.githubusercontent.com/taot1982/live/refs/heads/main/merge.py" -o merge.py

      - name: Fetch iptv source
        run: python scripts/fetch_iptv.py

      - name: Fix iptasd source
        run: python scripts/fix_iptasd.py

      - name: Fetch zhibo source（央视咪咕）
        run: python scripts/fetch_zhibo.py

      - name: Run merge.py 合并生成 live.txt
        run: python3 merge.py

      - name: 强制刷新 live.txt 修改时间（内容不变也更新时间戳）
        run: |
          touch live.txt

      - name: Commit & Push updated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.txt iptv.txt iptasd.txt zhibo.txt ZB.TXT merge.py
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update live (force file change)"
          git push
