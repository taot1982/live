name: Auto Fetch & Convert IPTV Sources
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run fix zhibo
        run: python scripts/fix.py

      - name: Run fix iptasd
        run: python scripts/fix_iptasd.py

      - name: Commit changed files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add fixed_zhibo.txt iptasd.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 auto update sources"
          git push
