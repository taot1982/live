name: Generate live list
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install requests
        run: pip install requests
      - name: run script
        run: python3 main.py
      - name: commit output
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"
          git add live.txt
          git commit -m "auto update live.txt" || echo "no changes"
          git push
