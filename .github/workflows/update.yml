name: Auto IPTV Update & Check
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'
  push:
    branches: [ main ]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python fetch_and_check.py

      - name: Commit & Push
        run: |
          git config --global user.name "IPTV Bot"
          git config --global user.email "bot@example.com"
          git add live.txt
          git commit -m "auto update source" || echo "no change"
          git push
