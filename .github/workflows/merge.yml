name: Merge IPTV Source
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Python merge script
        run: python3 merge.py

      - name: Upload live.txt for download
        uses: actions/upload-artifact@v4
        with:
          name: live-source
          path: live.txt

      - name: Commit & Push updated live.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.txt
          git commit -m "auto update live.txt" || echo "no changes"
          git push origin main
