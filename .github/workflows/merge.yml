name: Auto Generate Live
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Run Python script
        run: python3 merge.py

      - name: 强制修改live.txt，制造变更（调试用）
        run: |
          # 追加一行时间标记，每次run都会不一样，git一定会识别到变更
          echo "# Update at $(date -Iseconds)" >> live.txt

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.txt
          git commit -m "auto update live (force file change)"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
