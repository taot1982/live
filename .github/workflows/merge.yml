name: Merge IPTV Source
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Python merge script
        run: python3 merge.py

      - name: Upload live.txt for download
        uses: actions/upload-artifact@v4
        with:
          name: live-source
          path: live.txt

