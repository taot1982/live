name: Auto Generate Live
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
  push:
    paths:
      - 'iptv.txt'
      - 'merge.py'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install python deps
        run: pip3 install requests
      - name: Run Python
        run: python3 merge.py
      - name: Commit & Push
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git add live.txt
          git commit -m "auto update live" || true
          git push
