name: Fetch iptv.txt
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'  # UTC 每8小时执行一次

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Fetch iptv source
        env:
          UPSTREAM_URL: ${{ secrets.UPSTREAM_URL }}
        run: python scripts/fetch_iptv.py

      - name: Commit & Push file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add iptv.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update iptv.txt (refresh timestamp)"
          git push

