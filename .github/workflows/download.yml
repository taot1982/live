name: Download ZB.TXT
on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 */12 * * *' # UTC时间每12小时自动运行

jobs:
  download_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ZB.TXT
        env:
          ZB_TARGET_URL: ${{ secrets.ZB_URL }}
        run: |
          curl -fsSL -m 20 "${ZB_TARGET_URL}" -o ZB.TXT

      - name: Commit & Push file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ZB.TXT
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update ZB.TXT"
          git push
