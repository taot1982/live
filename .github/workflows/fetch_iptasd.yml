name: Fetch iptasd.txt
on:
  workflow_dispatch: # 支持手动点运行测试
  schedule:
    - cron: '0 */12 * * *' # UTC 每12小时执行一次

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Run fetch_iptasd.py
        run: python fetch_iptasd.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add iptasd.txt
          # 有变更才提交，无变更跳过
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update iptasd.txt"
          git push
